name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Run the tests
        run: cargo test --all-features --locked -- --include-ignored
      - name: Build twice and verify
        run: scripts/verify-release.sh "$TARGET" "$RUNNER_TEMP/verify"
      - name: Check the tag matches the version
        run: |
          test "$("$RUNNER_TEMP/verify/one/inshape-$TARGET" --version)" = "inshape ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inshape-${{ matrix.target }}
          path: ${{ runner.temp }}/verify/one/inshape-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: inshape-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          sha256sum inshape-x86_64-unknown-linux-musl inshape-aarch64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/inshape-x86_64-unknown-linux-musl
            assets/inshape-aarch64-unknown-linux-musl
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            assets/inshape-x86_64-unknown-linux-musl \
            assets/inshape-aarch64-unknown-linux-musl \
            assets/SHA256SUMS
