[package]
name = "inshape"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/electric-lump-software/inshape"
description = "Loads secrets from Infisical, checks them, then starts your command"
publish = false

[lib]
name = "inshape"
path = "src/lib.rs"

[[bin]]
name = "inshape"
path = "src/main.rs"

[features]
insecure-http-for-tests = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
